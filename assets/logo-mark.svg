<?xml version="1.0" encoding="UTF-8"?>
<!--
  Addis Rentals — brand mark (badge only).
  Used in the site header, the browser tab icon and the footer lockup.
  The skyline represents the Addis Ababa skyline; the green roof and the
  green/yellow/red band reference the Ethiopian tricolour.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Addis Rentals">
    <defs>
        <linearGradient id="arBadge" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b82f6"/>
            <stop offset="1" stop-color="#0284c7"/>
        </linearGradient>
    </defs>

    <!-- Badge -->
    <rect x="0" y="0" width="64" height="64" rx="17" fill="url(#arBadge)"/>
    <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="16.4" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>

    <!-- Skyline blocks -->
    <g fill="#ffffff">
        <rect x="11" y="31" width="9" height="18" rx="1.7"/>
        <rect x="22.5" y="23" width="10.5" height="26" rx="1.7"/>
        <rect x="35.5" y="28" width="8" height="21" rx="1.7"/>
        <rect x="45.5" y="34.5" width="7" height="14.5" rx="1.7"/>
    </g>

    <!-- Roof accent over the tallest block -->
    <path d="M22.5 21.5 L27.75 14.5 L33 21.5 Z" fill="#10b981"/>

    <!-- Windows -->
    <g fill="#0284c7" fill-opacity="0.55">
        <rect x="13.4" y="34" width="1.9" height="1.9" rx="0.5"/>
        <rect x="16.6" y="34" width="1.9" height="1.9" rx="0.5"/>
        <rect x="13.4" y="38.4" width="1.9" height="1.9" rx="0.5"/>
        <rect x="16.6" y="38.4" width="1.9" height="1.9" rx="0.5"/>
        <rect x="25" y="26.5" width="1.9" height="1.9" rx="0.5"/>
        <rect x="28.2" y="26.5" width="1.9" height="1.9" rx="0.5"/>
        <rect x="25" y="30.9" width="1.9" height="1.9" rx="0.5"/>
        <rect x="28.2" y="30.9" width="1.9" height="1.9" rx="0.5"/>
        <rect x="37.7" y="31.5" width="1.8" height="1.8" rx="0.5"/>
        <rect x="40.7" y="31.5" width="1.8" height="1.8" rx="0.5"/>
        <rect x="47.3" y="37.5" width="1.7" height="1.7" rx="0.5"/>
        <rect x="49.9" y="37.5" width="1.7" height="1.7" rx="0.5"/>
    </g>

    <!-- Ethiopian tricolour band -->
    <g>
        <rect x="11" y="52.5" width="13.2" height="3.2" rx="1.6" fill="#078930"/>
        <rect x="24.2" y="52.5" width="13.4" height="3.2" fill="#fcdd09"/>
        <rect x="37.6" y="52.5" width="13.4" height="3.2" rx="1.6" fill="#da121a"/>
    </g>
</svg>
