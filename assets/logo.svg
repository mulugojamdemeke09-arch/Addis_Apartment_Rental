<?xml version="1.0" encoding="UTF-8"?>
<!--
  Addis Rentals — full horizontal lockup (badge + wordmark).
  Latin letterforms only, so it renders identically on every machine.
  The Amharic tagline is rendered as HTML text in the page, where the full
  Ethiopic font stack is available.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-label="Addis Rentals — apartment rentals in Addis Ababa">
    <defs>
        <linearGradient id="arBadgeL" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b82f6"/>
            <stop offset="1" stop-color="#0284c7"/>
        </linearGradient>
    </defs>

    <g>
        <rect x="0" y="0" width="64" height="64" rx="17" fill="url(#arBadgeL)"/>
        <g fill="#ffffff">
            <rect x="11" y="31" width="9" height="18" rx="1.7"/>
            <rect x="22.5" y="23" width="10.5" height="26" rx="1.7"/>
            <rect x="35.5" y="28" width="8" height="21" rx="1.7"/>
            <rect x="45.5" y="34.5" width="7" height="14.5" rx="1.7"/>
        </g>
        <path d="M22.5 21.5 L27.75 14.5 L33 21.5 Z" fill="#10b981"/>
        <rect x="11" y="52.5" width="13.2" height="3.2" rx="1.6" fill="#078930"/>
        <rect x="24.2" y="52.5" width="13.4" height="3.2" fill="#fcdd09"/>
        <rect x="37.6" y="52.5" width="13.4" height="3.2" rx="1.6" fill="#da121a"/>
    </g>

    <text x="80" y="34" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="25" font-weight="700" letter-spacing="-0.6" fill="#0f172a">Addis Rentals</text>
    <text x="80" y="51" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#64748b">APARTMENT RENTALS · ADDIS ABABA</text>
</svg>
